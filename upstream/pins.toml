# Upstream implementations this project compares against, pinned by commit.
#
# Pinned rather than tracked, because a comparison against "latest" is not a
# comparison: the number in the report has to name the thing it was measured
# against. `scripts/check-upstream-pins.sh` fails if a pin no longer resolves,
# so a typo or a force-push upstream is caught here instead of quietly making
# every downstream comparison meaningless.
#
# Every source MUST carry a `rev`. An unpinned source cannot be compared
# against, and the checker rejects one rather than skipping it: a pin check
# that quietly tolerates the entries it should be enforcing is worse than no
# pin check, because it reads as coverage.
#
# Refresh with `scripts/update-pins.sh`, which opens a PR rather than pushing,
# so a version bump is visible as its own change.
#
# Each source carries `test_enabled`: whether its test suite runs against
# Dovetail binaries in CI yet (see `docs/conformance.md`). Suites are NEVER
# copied here — sing-box is GPL-3.0, Xray-core/xray-rust are MPL-2.0, PattNG is
# GPL-3.0 — they run unmodified from the pinned commit. A suite flips to
# `test_enabled = true` only when its transport rung is implemented and its
# differential proof is green; until then CI creates the job, skips it, and
# prints the reason, so the gap is named rather than silent.
#
# Each source also carries `dovetail_binary`: the Dovetail binary its suite
# executes once wired (empty until one is), and `seam`: the environment variable
# at the pinned commit through which that binary is injected. `run-upstream-suite.sh`
# fails an enabled entry with no binary, and refuses to call a suite that cannot
# read the seam a run against one — a binary that is built and never executed
# proves nothing, which is the failure this pair of fields exists to make visible.
#
# `gate_tests` is the space-separated list of upstream test names that must pass.
# The `suite` command itself is the whole unmodified upstream command, and every
# test it runs prints its own verdict; the gate is the subset that may be green
# while the rest fail, because a rung that has not landed cannot be. A test that
# passes without the gate naming it fails the job, so the count reported in
# docs/conformance.md cannot drift upward without a commit that says so.

[sources.xray-core]
repo          = "https://github.com/XTLS/Xray-core"
rev           = "b26a91de4f3294e26a0ad0a970b81a386a41f789"
default_branch = "main"
path          = "crypto/chacha20"
test_enabled  = false
suite         = "go test -count=1 -timeout 8m ./proxy/vless/..."
dovetail_binary = ""
note          = "vmess and shadowsocks record layer; the four-block refill this workspace removes. Suite runs upstream's own VLESS tests at this pin (guards the reference behavior rung 1 claims to match); our header differential is vless::tests in cargo test. Disabled: in-process Go with no seam at this rev (0 os/exec in proxy/vless), so no Dovetail binary can be injected"

[sources.sing-box]
repo          = "https://github.com/SagerNet/sing-box"
rev           = "c992297988288565a24a6d36e2cf4d77cb835fcd"
# sing-box's default branch is `testing`, not `main`. `main` does not resolve, so
# a pin that named it would sit behind nothing and the checker's staleness note
# would never fire.
default_branch = "testing"
path          = "common/crypto"
test_enabled  = false
dovetail_binary = ""
note          = "the chacha20poly1305 usage whose one-shot interface forces a refill per call"

[sources.amneziawg-go]
repo          = "https://github.com/amnezia-vpn/amneziawg-go"
rev           = "b5928efb6ca19f0153958460c3d141f04abc5c2e"
default_branch = "master"
path          = "device/noise"
test_enabled  = false
dovetail_binary = ""
note          = "hand-rolled ChaCha20 in the WireGuard data path"

[sources.amnezia-client]
repo          = "https://github.com/amnezia-vpn/amnezia-client"
rev           = "94b51df24790bf52427afe82d81c87a95460bdfd"
default_branch = "dev"
path          = "src/crypto"
test_enabled  = false
dovetail_binary = ""
note          = "the C++ Amnezia core; the second implementation of the same wire format"

[sources.xray-rust]
repo          = "https://github.com/aimalygin/xray-rust"
rev           = "7a4fb2dd382b8041d6d997b0185397045c8da463"
default_branch = "main"
path          = "crates"
test_enabled  = false
dovetail_binary = ""
seam           = "XRAY_VLESS_FULL_BINARY"
note          = "mobile-first Rust VLESS/REALITY/Vision core; compared in compare.yml once the reality rung dials"

[sources.pattng]
repo          = "https://github.com/patterniha/PattNG"
rev           = "ad6f747ca50cec4b2427c9c0b5d0465f0eff5932"
default_branch = "my-releases"
path          = "V2rayNG"
test_enabled  = false
dovetail_binary = ""
note          = "v2rayNG fork for Iranians: cipherSuites + unsafe fingerprints, aether core, plaintext VLESS/TROJAN to public (the superset rows)"

[sources.zeronet]
repo          = "https://github.com/TheGorgeousIvorChival/ZeroNet"
# Fork first; the official repo is the fallback when the fork is unreachable
# (see scripts/fetch-upstream.sh). The pin must resolve in whichever answers.
fallback_repo = "https://github.com/zeghostwriter/ZeroNet"
rev           = "97a99734e95029c8bf90ab0cdc578d0561a57724"
default_branch = "main"
path          = "crates"
test_enabled  = true
suite         = "cargo test -p zero-runtime --test xray_oracle -- --ignored --test-threads=1"
gate_tests    = "vless_over_raw_tcp_matches_the_oracle"
dovetail_binary = "dovetail-zeronet"
seam           = "ZRAY_XRAY_BINARY"
note          = "MIT-licensed Zray core + TUI + Android app; dovetail-zeronet builds the same app surface on dovetail-core. Enabled with the full unmodified xray_oracle command: all 17 tests run and every verdict is printed, and the gate is the one that passes. The other 16 need transports, protocols or REALITY this binary does not serve yet, and stay named failures in docs/conformance.md"