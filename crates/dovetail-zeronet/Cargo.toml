[package]
name = "dovetail-zeronet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "ZeroNet-compatible application built on the released dovetail-core (MIT)"

[lints]
workspace = true

[dependencies]
# Single-block cipher for `VMess` auth ids.
aes = "0.8"
# AEAD for the `shadowsocks` chunk transport (`aes-256-gcm` only).
aes-gcm = "0.10"
# The ZeroNet app on the *released* core: `version = "0.1.0"` is the requirement
# (see the workspace `dovetail-core` entry) and `path` is the checkout fallback
# so this builds without a registry. Releasing `dovetail-core 0.1.0` keeps this
# line unchanged — the version requirement is what stops the app from silently
# building against an older core. No Xray-core/sing-box/xray-rust/PattNG/ZeroNet
# source is copied here; links are parsed by `dovetail_core::vless`.
dovetail-core = { workspace = true }
# Portable randomness for `x25519` key generation (no other entropy source).
getrandom = "0.2"
# Session subkeys for the `shadowsocks` chunk transport (`ss-subkey` info).
hkdf = "0.12"
# Master keys for the `shadowsocks` chunk transport (`EVP_BytesToKey`).
md5 = "0.7"
# Hash behind the `shadowsocks` subkey derivation.
sha1 = "0.10"
# Length masking stream for the `VMess` rung (`SHAKE128`).
sha3 = "0.10"
# Password hashing for the `trojan` handshake (`SHA224`, hex).
sha2 = "0.10"
# Real X25519 for the `x25519` subcommand the oracle seams call for keys.
x25519-dalek = "2"

[dev-dependencies]
# The `AEAD` the data path used before `dovetail_core::aead` took over, used
# *only* by the differential test that decides whether the swap is allowed in.
# A dev-dependency is not linked into the shipped binary, which is the whole
# point: if the shipped path could reach it, "bit-identical" would be a
# statement about this crate comparing itself.
chacha20poly1305 = "0.10"
